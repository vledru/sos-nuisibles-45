<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:18px}
  .bar{height:18px;background:#fec503;border-radius:4px}
  .lab{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:78px}
  .px{font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--fg)}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="lab">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="lab">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px · gap btn icon</span></div>
  <div class="row"><span class="lab">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px · check gap</span></div>
  <div class="row"><span class="lab">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="lab">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px · footer columns</span></div>
  <div class="row"><span class="lab">space-7</span><div class="bar" style="width:28px"></div><span class="px">28px · card padding · grid gap</span></div>
  <div class="row"><span class="lab">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px · section-px max</span></div>
  <div class="row"><span class="lab">space-16</span><div class="bar" style="width:64px"></div><span class="px">64px · hero column gap</span></div>
</div>
</body></html>
