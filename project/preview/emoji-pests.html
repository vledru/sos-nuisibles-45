<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .grid{padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;text-align:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:14px;border:1px solid var(--border);background:#fff}
  .e{font-size:34px;line-height:1}
  .name{font-family:var(--font-display);font-weight:600;font-size:11px;color:var(--muted);line-height:1.3}
</style></head><body>
<div class="grid">
  <div class="cell"><span class="e">🐀</span><span class="name">Rat surmulot</span></div>
  <div class="cell"><span class="e">🐁</span><span class="name">Souris grise</span></div>
  <div class="cell"><span class="e">🐭</span><span class="name">Rat noir</span></div>
  <div class="cell"><span class="e">🐿️</span><span class="name">Mulot</span></div>
  <div class="cell"><span class="e">🦦</span><span class="name">Ragondin</span></div>
  <div class="cell"><span class="e">🦫</span><span class="name">Campagnol</span></div>
  <div class="cell"><span class="e">🪳</span><span class="name">Cafard</span></div>
  <div class="cell"><span class="e">🐝</span><span class="name">Guêpe / frelon</span></div>
  <div class="cell"><span class="e">🛏️</span><span class="name">Punaise de lit</span></div>
  <div class="cell"><span class="e">🚨</span><span class="name">Urgence</span></div>
</div>
</body></html>
