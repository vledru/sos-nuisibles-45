<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .bar{background:var(--accent);display:grid;grid-template-columns:repeat(4,1fr)}
  .item{padding:32px 20px;text-align:center;border-right:1px solid oklch(58% 0.18 70 / 0.3)}
  .item:last-child{border-right:none}
  .num{font-family:var(--font-display);font-weight:900;font-size:40px;color:var(--fg);line-height:1;margin-bottom:4px}
  .lab{font-size:13px;color:var(--accent-dark);font-weight:600;font-family:var(--font-display)}
</style></head><body>
<div class="bar">
  <div class="item"><div class="num">500+</div><div class="lab">Interventions</div></div>
  <div class="item"><div class="num">24h</div><div class="lab">Service d'urgence</div></div>
  <div class="item"><div class="num">98%</div><div class="lab">Clients satisfaits</div></div>
  <div class="item"><div class="num">10 ans</div><div class="lab">D'expérience dans le 45</div></div>
</div>
</body></html>
