<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .wrap{padding:24px;display:flex;justify-content:center}
  .cta{background:var(--fg);color:#fff;border-radius:20px;padding:36px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;flex-wrap:wrap}
  h2{font-family:var(--font-display);font-weight:800;font-size:26px;margin-bottom:8px;line-height:1.2}
  h2 span{color:var(--accent)}
  p{font-size:14px;opacity:.7}
  .acts{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:15px;padding:14px 24px;border-radius:8px}
  .btn-d{background:var(--danger);color:#fff}
  .btn-p{background:var(--accent);color:var(--fg)}
</style></head><body>
<div class="wrap">
  <div class="cta">
    <div>
      <h2>Un problème de nuisibles ?<br><span>Appelez-nous maintenant.</span></h2>
      <p>Service d'urgence 24h/24 — Intervention rapide dans tout le Loiret</p>
    </div>
    <div class="acts">
      <a class="btn btn-d">02 46 91 56 20</a>
      <a class="btn btn-p">Devis gratuit</a>
    </div>
  </div>
</div>
</body></html>
