<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .wrap{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 1px 4px oklch(0% 0 0 / 0.06), 0 2px 8px oklch(0% 0 0 / 0.05)}
  .stars{color:var(--accent);font-size:18px;letter-spacing:2px;margin-bottom:12px}
  .txt{font-family:-apple-system,system-ui,sans-serif;font-size:14px;color:var(--fg);line-height:1.7;margin-bottom:18px;font-style:italic}
  .auth{display:flex;align-items:center;gap:12px}
  .av{width:42px;height:42px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--accent-dark)}
  .nm{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--fg)}
  .loc{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="wrap">
  <div class="card">
    <div class="stars">★★★★★</div>
    <p class="txt">"Intervention ultra-rapide pour un problème de rats. Le technicien était là en moins d'une heure."</p>
    <div class="auth"><div class="av">JM</div><div><div class="nm">Jean-Marc D.</div><div class="loc">Orléans (45)</div></div></div>
  </div>
  <div class="card">
    <div class="stars">★★★★★</div>
    <p class="txt">"Nid de frelons à 8 mètres. L'équipe a géré ça avec beaucoup de professionnalisme."</p>
    <div class="auth"><div class="av">SL</div><div><div class="nm">Sophie L.</div><div class="loc">Montargis (45)</div></div></div>
  </div>
</div>
</body></html>
