<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:oklch(99% 0.003 90)}
  .wrap{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px oklch(0% 0 0 / 0.06), 0 2px 8px oklch(0% 0 0 / 0.05);display:flex;flex-direction:column}
  .img{aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff}
  .body{padding:22px}
  .icon{width:56px;height:56px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .icon svg{width:28px;height:28px;color:var(--accent-dark)}
  h3{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--fg);margin-bottom:8px}
  p{color:var(--muted);font-size:14px;line-height:1.6}
</style></head><body>
<div class="wrap">
  <div class="card">
    <div class="img" style="background:linear-gradient(135deg, oklch(20% 0.02 60), oklch(30% 0.04 60))">🐀</div>
    <div class="body">
      <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87"/></svg></div>
      <h3>Dératisation</h3>
      <p>Élimination certifiée des rats, souris et mulots — appâts sécurisés et rapport d'intervention.</p>
    </div>
  </div>
  <div class="card">
    <div class="img" style="background:linear-gradient(135deg, oklch(18% 0.03 200), oklch(28% 0.05 180))">🪳</div>
    <div class="body">
      <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/></svg></div>
      <h3>Désinsectisation</h3>
      <p>Cafards, guêpes, frelons, puces. Traitements ciblés ou préventifs, nids en hauteur inclus.</p>
    </div>
  </div>
</div>
</body></html>
