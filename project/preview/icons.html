  .ico{width:48px;height:48px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;color:var(--accent-dark)}
  .ico svg{width:26px;height:26px}
  .name{font-family:var(--font-display);font-weight:600;font-size:11px;color:var(--fg);line-height:1.3}
