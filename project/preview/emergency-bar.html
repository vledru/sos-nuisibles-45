<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .bar{background:var(--danger);color:#fff;text-align:center;padding:14px 24px;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
  .bar a{color:#fff;text-decoration:underline;font-weight:800}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .note{padding:18px 24px;font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
</style></head><body>
<div class="bar"><span class="dot"></span><strong>Urgence 24h/24 &amp; 7j/7</strong> — Intervention rapide dans tout le Loiret — Appelez maintenant : <a>02 46 91 56 20</a></div>
<div class="note">Sticky top banner · always visible · the only place pulsing animation is used outside the hero</div>
</body></html>
