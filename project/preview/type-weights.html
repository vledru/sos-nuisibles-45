<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .wrap{padding:22px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 28px}
  .cell{display:flex;flex-direction:column;gap:6px}
  .glyph{font-family:var(--font-display);color:var(--fg);font-size:38px;line-height:1}
  .meta{font-family:var(--font-display);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
</style></head><body>
<div class="wrap">
  <div class="cell"><span class="glyph" style="font-weight:400">Aa</span><span class="meta">400 · Regular</span></div>
  <div class="cell"><span class="glyph" style="font-weight:500">Aa</span><span class="meta">500 · Medium</span></div>
  <div class="cell"><span class="glyph" style="font-weight:600">Aa</span><span class="meta">600 · Semibold</span></div>
  <div class="cell"><span class="glyph" style="font-weight:700">Aa</span><span class="meta">700 · Bold</span></div>
  <div class="cell"><span class="glyph" style="font-weight:800">Aa</span><span class="meta">800 · Extrabold</span></div>
  <div class="cell"><span class="glyph" style="font-weight:900">Aa</span><span class="meta">900 · Black</span></div>
</div>
</body></html>
