<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .head{background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 4px oklch(0% 0 0 / 0.06)}
  .inner{padding:0 24px;height:80px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .logo{display:flex;align-items:center;height:68px;overflow:hidden}
  .logo img{height:96px;margin-top:-14px}
  nav{display:flex;align-items:center;gap:4px}
  nav a{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--fg);padding:8px 12px;border-radius:8px}
  nav a.active{color:var(--accent-dark);background:var(--accent-light)}
  .phone{display:flex;align-items:center;gap:8px;background:var(--danger);color:#fff;font-family:var(--font-display);font-weight:800;font-size:15px;padding:10px 18px;border-radius:8px;white-space:nowrap}
  .phone svg{width:16px;height:16px}
</style></head><body>
<header class="head">
  <div class="inner">
    <div class="logo"><img src="../assets/sos-nuisibles-45-logo.png" alt=""></div>
    <nav>
      <a class="active">Accueil</a>
      <a>Dératisation</a>
      <a>Désinsectisation</a>
      <a>Punaises de lit</a>
      <a>Contact &amp; Devis</a>
    </nav>

  </div>

</body></html>
