<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;background:#fff}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px dashed var(--border);padding-bottom:14px}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .label{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:90px;flex-shrink:0}
  .sample{font-family:var(--font-display);color:var(--fg)}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="label">Display 60</span><span class="sample" style="font-weight:900;font-size:44px;line-height:1">Nuisibles <em style="font-style:normal;color:var(--accent)">Loiret</em></span></div>
  <div class="row"><span class="label">H2 40</span><span class="sample" style="font-weight:800;font-size:32px;line-height:1.1">Tous les traitements nuisibles</span></div>
  <div class="row"><span class="label">H3 20</span><span class="sample" style="font-weight:800;font-size:20px">Dératisation</span></div>
  <div class="row"><span class="label">H4 17</span><span class="sample" style="font-weight:700;font-size:17px">Réactivité maximale</span></div>
</div>
</body></html>
